name: Deploy lobby

on:
  push:
    branches: [main]
    # A versão web (lobby/public/web) sai do código do app (PC e Android): muda junto com ele e a cada versão.
    paths: ["lobby/**", "src/web/**", "src/mobile/**", "src/shared/**", "src/renderer/**", "scripts/build-web.mjs", "scripts/build-mobile.mjs", "package.json", "CHANGELOG.md", ".github/workflows/deploy-lobby.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lobby/package-lock.json
            package-lock.json

      # Versão web (assistir pelo site): só precisa do esbuild e das libs do app, não do Electron.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: node scripts/build-web.mjs

      - run: npm ci
        working-directory: lobby

      - run: npx tsc
        working-directory: lobby

      # Os segredos OAuth (wrangler secret put …) ficam guardados na Cloudflare e valem para todo deploy.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lobby
