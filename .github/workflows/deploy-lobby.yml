name: Deploy lobby

on:
  push:
    branches: [main]
    paths: ["lobby/**", ".github/workflows/deploy-lobby.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lobby/package-lock.json

      - run: npm ci
        working-directory: lobby

      - run: npx tsc
        working-directory: lobby

      # Os segredos OAuth (wrangler secret put …) ficam guardados na Cloudflare e valem para todo deploy.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: lobby
