# Publica sozinho: toda vez que o código vai para a "main" com uma versão nova no package.json
# (ainda sem release), gera o instalador e cria a tag e a release com tudo o que a atualização
# automática precisa (o .exe, o .zip portátil, o latest.yml e os hashes).
#
#   Para lançar a 0.5.1:  edite "version" no package.json  →  git commit  →  git push
#   Pushes sem versão nova terminam em segundos sem fazer nada.
#
# Também funciona se você criar a tag "vX.Y.Z" na mão, ou rodando "release" na aba Actions.
name: release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      force:
        description: 'Refazer e sobrescrever os arquivos mesmo que a release já exista'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versão a publicar
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::A tag é $GITHUB_REF_NAME, mas o package.json diz $v. Sem isso o app não reconheceria a atualização."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Já publicada (release com o latest.yml)? Então não há nada a fazer.
          if [ "$FORCE" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.yml'; then
            echo "A release $tag já está publicada: nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Vai publicar $tag."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Ferramentas do instalador (NSIS e zip)
        if: steps.ver.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis zip

      - name: Novidades escritas no CHANGELOG.md
        if: steps.ver.outputs.skip != 'true'
        run: node scripts/changelog.mjs check

      - if: steps.ver.outputs.skip != 'true'
        run: npm ci
      - if: steps.ver.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.ver.outputs.skip != 'true'
        run: npm run dist
        env:
          MAKENSIS: makensis

      - name: Criar a release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Texto da release = seção da versão no CHANGELOG.md (o mesmo da página Novidades do app).
          node scripts/changelog.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          cd release
          ls -la
          test -f "AriranhaCast-Setup-$VERSION.exe"
          test -f latest.yml
          files="AriranhaCast-Setup-*.exe AriranhaCast-portatil-*.zip latest.yml SHA256SUMS.txt"
          # Se a release já existe (criada pelo site), só anexa os arquivos; senão, cria
          # (junto com a tag, apontando para este commit).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AriranhaCast $VERSION" --notes-file "$RUNNER_TEMP/notes.md" $files
          fi

  # App Android (protótipo): gera o APK e anexa à release da versão atual.
  android:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dependências
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm ci --prefix mobile

      - name: Página do app
        run: |
          npm --prefix mobile run typecheck
          node scripts/build-mobile.mjs
          cd mobile && npx cap sync android

      - name: Chave de assinatura (segredo ANDROID_KEYSTORE_B64, se existir)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem o segredo ANDROID_KEYSTORE_B64: o APK sai assinado com uma chave de depuração (cada versão precisa desinstalar a anterior)."
          fi

      - name: APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          v=$(node -p "require('./package.json').version")
          IFS=. read -r a b c <<< "$v"
          export ANDROID_VERSION_NAME="$v" ANDROID_VERSION_CODE=$((a * 10000 + b * 100 + c))
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/AriranhaCast-Android-$v.apk"
          echo "APK=AriranhaCast-Android-$v.apk" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"

      # O app Android confere este arquivo ao abrir e oferece a atualização (baixa, confere o SHA-256
      # e abre o instalador). Só sai com a chave estável: com a de depuração o Android recusaria
      # instalar por cima.
      - name: Aviso de atualização (latest-android.json)
        if: env.ANDROID_KEYSTORE_FILE != ''
        run: |
          v=$(node -p "require('./package.json').version")
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          # "notes": novidades desta versão (o app mostra em "O que mudou" antes de atualizar).
          V="$v" APK="$APK" SHA="$sha" node --input-type=module -e "
            import { loadChangelog } from './scripts/changelog.mjs';
            import { writeFileSync } from 'node:fs';
            const e = loadChangelog(process.env.V).find((x) => x.version === process.env.V);
            if (!e) throw new Error('CHANGELOG.md sem a seção da versão');
            const notes = e.items.map((i) => (i.only === 'pc' ? 'PC: ' : i.only === 'android' ? 'Android: ' : '') + i.text);
            writeFileSync('latest-android.json', JSON.stringify({ version: process.env.V, apk: process.env.APK, sha256: process.env.SHA, notes }) + '\n');
          "
          cat latest-android.json
          echo "EXTRA=latest-android.json" >> "$GITHUB_ENV"

      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$APK" $EXTRA
